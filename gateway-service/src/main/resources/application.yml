server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  config:
    import:
      - "optional:nacos:${spring.application.name}.yaml"
      - "optional:nacos:common-jwt.yaml"
  application:
    name: gateway-service

  # ==================== Sleuth + Zipkin 链路追踪（阶段13） ====================
  # Sleuth 自动埋点：HTTP/Feign/定时任务生成 traceId-spanId 并透传；traceId 自动写入 MDC，
  # 与阶段12③ 的日志 pattern（%X{traceId}）无缝衔接，无需改日志代码
  sleuth:
    sampler:
      # 采样率 1.0 = 全采样（学习环境抓全量链路；生产一般 0.01~0.1）
      probability: 1.0
  # 链路数据上报地址，对应 dev-env-docker 的 zipkin 容器（9411）
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=2
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
    sentinel:
      # 启动即初始化 Sentinel 并连接控制台（默认懒加载：首次请求触发才连接）
      eager: true
      transport:
        # Sentinel 控制台地址（控制台需单独部署，步骤见 docs/development/sentinel-integration.md）
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        # 客户端与控制台通信的本地命令端口，同机多实例端口占用时会自动递增
        port: 8719
      # 网关流控规则持久化：从 Nacos 配置中心读取并监听变更（实时生效，无需重启）。
      # 注意：网关使用 GatewayFlowRule（rule-type: gw-flow），resource 对应路由 id 或自定义 API 分组，
      # 与普通微服务的 FlowRule 不同。dataId 内容见 docs/development/sentinel-integration.md
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-gw-flow-rules
            data-type: json
            rule-type: gw-flow

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DB:0}

gateway:
  auth:
    whitelist:
      - /api/user/auth/login
      - /api/user/auth/register

management:
  endpoints:
    web:
      exposure:
        include: "*"
