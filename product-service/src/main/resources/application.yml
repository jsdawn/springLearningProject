server:
  port: 8082

spring:
  config:
    import:
      - "optional:nacos:${spring.application.name}.yaml"
      - "optional:nacos:common-jwt.yaml"
  application:
    name: product-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: []
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    # 无密码配置
    database: ${REDIS_DB:0}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    sentinel:
      # 启动即初始化 Sentinel 并连接控制台（默认懒加载：首次请求触发才连接）
      eager: true
      # 资源名携带 HTTP 方法前缀，如 GET:/products/{id}，便于区分同路径不同方法
      http-method-specify: true
      transport:
        # Sentinel 控制台地址（控制台需单独部署，步骤见 docs/development/sentinel-integration.md）
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        # 客户端与控制台通信的本地命令端口，同机多实例端口占用时会自动递增
        port: 8719
      # 规则持久化：统一从 Nacos 配置中心读取并监听变更（实时生效，无需重启），代码中不写死任何规则。
      # 需在 Nacos 创建对应 dataId（JSON 格式），内容见 docs/development/sentinel-integration.md
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

# ==================== Seata 分布式事务（AT 模式） ====================
# 版本对齐：spring-cloud-starter-alibaba-seata 由父工程 SCA BOM 2021.0.5.0 托管（1.6.1），
# 与 dev-env-docker 的 seata-server:1.6.1 镜像一致。
# 下单链路中本服务是 RM：扣减库存作为分支事务注册到 TC，全局回滚时由 Seata
# 依据 mall_db 的 undo_log 反向补偿，业务代码无需手动回补库存。
seata:
  enabled: true
  tx-service-group: mall_tx_group
  # AT 模式核心开关：自动代理 DataSource，否则扣库存不产生 undo_log，回滚无从谈起
  enable-auto-data-source-proxy: true
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      cluster: default
  service:
    vgroup-mapping:
      mall_tx_group: default

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.productservice.entity
