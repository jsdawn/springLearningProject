server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: []
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    # 无密码配置
    database: ${REDIS_DB:0}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    sentinel:
      # 启动即初始化 Sentinel 并连接控制台（默认懒加载：首次请求触发才连接）
      eager: true
      # 资源名携带 HTTP 方法前缀，如 GET:/products/{id}，便于区分同路径不同方法
      http-method-specify: true
      transport:
        # Sentinel 控制台地址（控制台需单独部署，步骤见 docs/development/sentinel-integration.md）
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        # 客户端与控制台通信的本地命令端口，同机多实例端口占用时会自动递增
        port: 8719
      # 规则持久化：统一从 Nacos 配置中心读取并监听变更（实时生效，无需重启），代码中不写死任何规则。
      # 需在 Nacos 创建对应 dataId（JSON 格式），内容见 docs/development/sentinel-integration.md
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.productservice.entity
