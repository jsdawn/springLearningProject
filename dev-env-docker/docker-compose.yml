services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  nacos:
    image: nacos/nacos-server:v${NACOS_VERSION}
    environment:
      MODE: standalone
    ports:
      - "${NACOS_PORT}:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs

  redis:
    image: redis:${REDIS_VERSION}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  sentinel:
    image: bladex/sentinel-dashboard:${SENTINEL_VERSION}
    ports:
      - "${SENTINEL_PORT}:8858"
    depends_on:
      - mysql
      - nacos
      - redis

volumes:
  mysql_data:
  nacos_data:
  nacos_logs:
  redis_data:
