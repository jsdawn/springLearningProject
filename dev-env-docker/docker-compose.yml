services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  nacos:
    image: nacos/nacos-server:v${NACOS_VERSION}
    environment:
      MODE: standalone
    ports:
      - "${NACOS_PORT}:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs

  redis:
    image: redis:${REDIS_VERSION}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  sentinel:
    image: bladex/sentinel-dashboard:${SENTINEL_VERSION}
    ports:
      - "${SENTINEL_PORT}:8858"
    depends_on:
      - mysql
      - nacos
      - redis

  # RabbitMQ（-management 镜像自带 Web 管理台 http://localhost:15672，默认 guest/guest）。
  # order-service 用其死信延时队列实现"下单后 30 分钟未支付自动关单"。
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    environment:
      TZ: Asia/Shanghai
      # 首次初始化时生效的默认账号（卷已存在则沿用历史数据，不会重置密码）
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"        # AMQP 协议端口，应用连接用
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"  # 管理台端口，浏览器观察队列/消息用
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  nacos_data:
  nacos_logs:
  redis_data:
  rabbitmq_data:
