services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  nacos:
    image: nacos/nacos-server:v${NACOS_VERSION:-2.5.3}
    environment:
      MODE: standalone
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_PORT2:-9849}:9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs

  redis:
    image: redis:${REDIS_VERSION:-5.0.14}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  sentinel:
    image: bladex/sentinel-dashboard:${SENTINEL_VERSION:-1.8.6}
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
    depends_on:
      - mysql
      - nacos
      - redis

  # RabbitMQ（-management 镜像自带 Web 管理台 http://localhost:15672，默认 guest/guest）。
  # order-service 用其死信延时队列实现"下单后 30 分钟未支付自动关单"。
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3.12-management}
    environment:
      TZ: Asia/Shanghai
      # 首次初始化时生效的默认账号（卷已存在则沿用历史数据，不会重置密码）
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP 协议端口，应用连接用
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # 管理台端口，浏览器观察队列/消息用
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Seata Server（AT 模式 TC，镜像版本对齐 SCA 2021.0.5.0 的 seata-spring-boot-starter 1.6.1）。
  # 配置方式：1.6.1 是 Spring Boot 应用，主配置在 /seata-server/resources/application.yml
  # （镜像 entrypoint 为纯 java 命令），这里只单文件覆盖 application.yml 把 registry 指到 Nacos，保留镜像其余文件。
  # ⚠️ 踩坑记录（2026-09-06 实测）：
  #   1. 容器 bridge 内网 IP（172.x）宿主不可直连，若按默认注册，Nacos 会把 172.x 下发给宿主机客户端 → 连不上 TC；
  #   2. SEATA_IP 环境变量可覆盖注册 IP，但**忽略 loopback**（设 127.0.0.1 无效），必须填宿主局域网 IP，
  #      hostname=localhost / hosts hack 也无效，Seata 取网卡地址）。
  #   3. SEATA_IP 放 .env 维护：换网络环境（IP 变化）只改 .env 一处。
  seata:
    image: seataio/seata-server:${SEATA_VERSION:-1.6.1}
    # Seata 启动时会向 Nacos 注册自身实例，注册失败会直接退出（Netty 端口已监听但 ServerRunner 抛错）。
    # depends_on 只保证容器"已启动"，不保证 Nacos"已就绪"（standalone 模式就绪需数十秒），
    # 冷启动同时拉起时 Seata 容易抢跑撞上 Connection refused 而退出。
    # 加 unless-stopped 让它在 Nacos 就绪前反复重试，避免每次都要手动 up。
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SEATA_IP: ${SEATA_IP}
    ports:
      - "${SEATA_PORT:-8091}:8091"        # TC 事务协调端口（客户端/分支事务连接）
      - "${SEATA_CONSOLE_PORT:-7091}:7091"  # 1.5+ 内置管理控制台（HTTP，账号 seata/seata）
    volumes:
      - ./seata/config/application.yml:/seata-server/resources/application.yml:ro
      - seata_store:/seata-server/file_store/data
    depends_on:
      - nacos

  # Zipkin Server（链路追踪收集端，阶段13 P5 可观测性）。
  # 四服务通过 spring-cloud-sleuth-zipkin 上报 span 到 http://localhost:9411；
  # Web UI: http://localhost:9411/zipkin。学习期用内存存储（STORAGE_TYPE=mem，重启数据清空），
  # 生产需换 elasticsearch/mysql 持久化。
  zipkin:
    image: openzipkin/zipkin:${ZIPKIN_VERSION:-3.0}
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"

volumes:
  mysql_data:
  nacos_data:
  nacos_logs:
  redis_data:
  rabbitmq_data:
  seata_store:
