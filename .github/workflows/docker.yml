name: Docker Images

# 不直接监听 push：由 CI 流水线跑完后接力触发（workflow_run 串行门禁）——
# 只有 CI 在 main 上编译+测试全绿，才构建四个服务镜像并推送 GHCR，
# 保证 GHCR 上永远不存在未通过测试的镜像。
# 镜像推送完成后由 deploy job 自动 SSH 到生产服务器拉取新镜像并重启，
# 完成 push → 测试 → 镜像 → 部署 的 Continuous Deployment 闭环。
# 用仓库自带 GITHUB_TOKEN 认证，无需额外配置密钥（deploy 用 SSH_* 三个 repository secret）
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build-push:
    # CI 失败/被取消时直接跳过整个构建
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-service, order-service, product-service, user-service]
    steps:
      # workflow_run 事件里 github.sha 是 main 最新提交，可能与触发 CI 的提交不同
      # （CI 运行期间又有新 push），所以 checkout 和镜像 tag 都必须显式用 head_sha
      - name: Resolve source commit
        id: vars
        run: echo "short_sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 产出两个 tag：sha-<短哈希>（不可变，用于回溯，取触发 CI 的那个提交）与 latest（始终指向最新 main）
      # 注意：GHCR 镜像名必须全小写
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 四个镜像全部推成功后，自动部署到生产服务器（Continuous Deployment）。
  # 服务器侧准备：~/.ssh/github_deploy 密钥对 + authorized_keys + GitHub Secrets
  # （SSH_HOST / SSH_USER / SSH_PRIVATE_KEY）。数据库迁移脚本不在此链路，仍手动执行。
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # 两次 push 的部署排队串行执行，避免交叉重建容器
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 默认 10 分钟不够：服务器到 GHCR 带宽抖动时 compose pull 可能超时
          command_timeout: 30m
          script: |
            set -e
            cd /opt/mall/app
            # 拿最新 compose / 种子文件（.env 不在 git，不受影响）
            git pull --ff-only
            docker compose -f deploy/docker-compose.prod.yml pull
            docker compose -f deploy/docker-compose.prod.yml up -d
            docker image prune -f

      # 冒烟验证：网关 → user-service → DB 链路活着（错误密码也应返回标准 400 响应体）
      - name: Smoke check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mall/app
            docker compose -f deploy/docker-compose.prod.yml ps --status running
            resp=$(curl -s -X POST http://localhost:28080/api/user/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"smoke_check","password":"wrong"}')
            echo "login smoke response: $resp"
            echo "$resp" | grep -q '"code":400'
