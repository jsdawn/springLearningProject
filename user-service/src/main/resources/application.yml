server:
  port: 8081

spring:
  config:
    import:
      - "optional:nacos:${spring.application.name}.yaml"
      - "optional:nacos:common-jwt.yaml"
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: []

  # ==================== Sleuth + Zipkin 链路追踪（阶段13） ====================
  # Sleuth 自动埋点：HTTP/Feign/定时任务生成 traceId-spanId 并透传；traceId 自动写入 MDC，
  # 与阶段12③ 的日志 pattern（%X{traceId}）无缝衔接，无需改日志代码
  sleuth:
    sampler:
      # 采样率 1.0 = 全采样（学习环境抓全量链路；生产一般 0.01~0.1）
      probability: 1.0
  # 链路数据上报地址，对应 dev-env-docker 的 zipkin 容器（9411）
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    sentinel:
      # 启动即初始化 Sentinel 并连接控制台（默认懒加载：首次请求触发才连接）
      eager: true
      # 资源名携带 HTTP 方法前缀，如 GET:/users/{id}，便于区分同路径不同方法
      http-method-specify: true
      transport:
        # Sentinel 控制台地址（控制台需单独部署，步骤见 docs/development/sentinel-integration.md）
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        # 客户端与控制台通信的本地命令端口，同机多实例端口占用时会自动递增
        port: 8719
      # 规则持久化：统一从 Nacos 配置中心读取并监听变更（实时生效，无需重启），代码中不写死任何规则。
      # 需在 Nacos 创建对应 dataId（JSON 格式），内容见 docs/development/sentinel-integration.md
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DB:0}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.userservice.entity
