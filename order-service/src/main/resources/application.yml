server:
  port: 8083

spring:
  config:
    import:
      - "optional:nacos:${spring.application.name}.yaml"
      - "optional:nacos:common-jwt.yaml"
  application:
    name: order-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: []
  # ==================== RabbitMQ 配置（订单超时关闭-死信延时队列） ====================
  # 拓扑与回调见 com.example.orderservice.config.RabbitMqConfig，
  # 整体方案说明见 docs/development/RabbitMQ死信延时关单集成说明.md
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 发布方确认（防消息丢失第一道）：correlated 异步回调模式，
    # 消息成功送达 Broker 后触发 ConfirmCallback(ack=true)，Broker 内部异常时 ack=false 并携带原因
    publisher-confirm-type: correlated
    # 发布方退回（防消息丢失第二道）：消息到达 Broker 但无法路由到任何队列时，触发 ReturnsCallback
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK（防消息丢失第三道）：消费者业务处理完成后显式 basicAck，
        # 处理异常时 basicNack 重投；避免自动 ACK 下"消息取出即确认、处理失败即丢失"
        acknowledge-mode: manual
        # 每个消费者一次只持有 1 条未确认消息，处理完再拉下一条，
        # 避免消息在本地堆积、宕机时大批量重投
        prefetch: 1
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        refresh-enabled: true
    sentinel:
      # 启动即初始化 Sentinel 并连接控制台（默认懒加载：首次请求触发才连接）
      eager: true
      # 资源名携带 HTTP 方法前缀，如 GET:/orders/{id}，便于区分同路径不同方法
      http-method-specify: true
      transport:
        # Sentinel 控制台地址（控制台需单独部署，步骤见 docs/development/sentinel-integration.md）
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        # 客户端与控制台通信的本地命令端口，同机多实例端口占用时会自动递增
        port: 8719
      # 规则持久化：统一从 Nacos 配置中心读取并监听变更（实时生效，无需重启），代码中不写死任何规则。
      # 需在 Nacos 创建对应 dataId（JSON 格式），内容见 docs/development/sentinel-integration.md
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-flow-rules
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            namespace: ${NACOS_NAMESPACE:}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: ${spring.application.name}-degrade-rules
            data-type: json
            rule-type: degrade

# ==================== Seata 分布式事务（AT 模式） ====================
# 版本对齐：spring-cloud-starter-alibaba-seata 由父工程 SCA BOM 2021.0.5.0 托管（1.6.1），
# 与 dev-env-docker 的 seata-server:1.6.1 镜像一致。
# 下单链路中本服务同时是 TM（@GlobalTransactional 开启全局事务）和 RM（订单入库分支）。
seata:
  enabled: true
  # 事务组名：客户端用它去 Nacos 找对应的 TC 集群（映射关系见下方 service.vgroup-mapping）
  tx-service-group: mall_tx_group
  # AT 模式核心开关：自动代理 DataSource，Seata 才能在业务 SQL 前后记录 undo_log 回滚快照。
  # 关掉则分支事务不注册、异常不回滚，AT 模式直接失效
  enable-auto-data-source-proxy: true
  registry:
    # 与 dev-env-docker/seata/config/application.yml 的 registry 段保持一致：
    # 从 Nacos 发现 seata-server 实例，拿到其注册地址（即 .env 的 SEATA_IP:8091）
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      cluster: default
  service:
    # 事务组 → TC 集群名映射，default 对应 Server 注册的 cluster=default。
    # 名字对不上会启动报 "no available service"，找不到 TC
    vgroup-mapping:
      mall_tx_group: default

# 开启 Feign 的 Sentinel 集成：Feign 调用自动纳入 Sentinel 统计（资源名形如
# GET:http://product-service/products/{id}），可对其配置限流/熔断规则。
# 未配置 fallback，被拦截时异常由全局异常处理器统一返回。
feign:
  sentinel:
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.orderservice.entity

# ==================== 订单业务自定义配置 ====================
order:
  mq:
    # 订单超时关闭延时时长：30 分钟 = 1800000 毫秒。
    # 作为 order.delay.queue 的 x-message-ttl（队列级 TTL，即最长延时上限）；
    # 发送消息时若单独指定了更短的消息级 TTL（测试接口场景），RabbitMQ 取两者中较短的生效
    delay-ttl-ms: 1800000

management:
  endpoints:
    web:
      exposure:
        include: "*"
